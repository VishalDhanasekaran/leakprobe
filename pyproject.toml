[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leakprobe"
version = "0.1.0"
description = "Measure whether a VPN tunnel actually protects traffic on Linux."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.6",
  "scapy>=2.5",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
leakprobe = "leakprobe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["leakprobe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scapy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["root: needs root and the lab (LEAKPROBE_LAB=1)"]
