name: wg-ipv6-leak
description: IPv4-only tunnel with tunnel DNS and an IPv4-only kill switch; IPv6 left on
wireguard:
  allowed_ips: ["0.0.0.0/0"]
  dns: 10.66.0.1
firewall: killswitch-v4
extra_routes: []
expected:
